services:
  - type: web
    name: starfield-cosmic-chess-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: PI_API_BASE_URL
        value: https://api.minepi.com
      - key: CORS_ORIGINS
        value: https://starfieldcosmicchess.com,https://www.starfieldcosmicchess.com,https://starfield-cosmic-chess.web.app,https://starfield-cosmic-chess.firebaseapp.com
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
